<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>kiraan secara loop</title>
</head>
<body>
<script>
	let buah=['apel','pisang','durian','KFC'];
	for(let i =0; i < buah.length;i++){
		console.log('buah ke- '+(i+1)+ ' adalah buah '+buah[i]);
	}
</script>
