<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<h1 id="masa">5</h1>
	<button onclick="mula()">kiraan mula</button>
<script>
	let count=5;
	let timer;
	function mula(){
		timer=setInterval(function(){
			count = count - 1;

			document.getElementById("masa").innerHTML=count;

			if(count ==0){
				clearInterval (timer);
				document.getElementById("masa").innerHTML="BOOOM!!!!!!!!!!!!!!!!";
				document.getElementById("masa").style.color="red";
			}
		},800);
	}
</script>
</body>
</html>
